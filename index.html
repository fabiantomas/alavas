<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Polar Sleep">
<meta name="theme-color" content="#1a1a2e">
<title>Polar Sleep</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--border:#e8e7e3;--text:#1a1a1a;--muted:#777;--accent:#2d5a9b;--accent2:#6c4fa0;--deep:#2d5a9b;--rem:#6c4fa0;--light:#bbb8ae;--warn:#c4600e;--good:#2d7a3a;--danger:#b33030}
@media(prefers-color-scheme:dark){:root{--bg:#141418;--card:#1e1e24;--border:#2c2c34;--text:#e8e7e3;--muted:#888;--accent:#5b8fd4;--accent2:#9b7fd4;--deep:#5b8fd4;--rem:#9b7fd4;--light:#666;--warn:#e0943a;--good:#5cb86c;--danger:#e05555}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-text-size-adjust:100%}
.app{max-width:600px;margin:0 auto;padding:16px;padding-bottom:env(safe-area-inset-bottom,16px)}
h1{font-size:20px;font-weight:600;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
@media(min-width:480px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat-v{font-size:20px;font-weight:600;margin-top:1px}
.stat-u{font-size:10px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tab{flex-shrink:0;font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chart-box{position:relative;height:200px}
.upload-zone{border:2px dashed var(--border);border-radius:14px;padding:24px 16px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px}
.upload-zone input{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-green{background:var(--good);color:#fff;border-color:var(--good)}
.hidden{display:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin-top:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;vertical-align:-1px;margin-right:3px}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.progress-text{font-size:11px;color:var(--muted)}
.sep{border:none;border-top:1px solid var(--border);margin:12px 0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:500px;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--border);font-weight:500;color:var(--muted);font-size:10px;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
td{padding:5px 4px;border-bottom:1px solid var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick-btns button{font-size:12px;padding:5px 10px}
</style>
</head>
<body>
<div class="app">
  <h1>🌙 Polar Sleep</h1>
  <p class="sub">Alvásadatok elemzése</p>

  <!-- Polar csatlakozás -->
  <div class="card" id="polar-card">
    <div class="row" style="justify-content:space-between">
      <div>
        <div style="font-size:14px;font-weight:500">Polar fiók</div>
        <div id="polar-status" style="font-size:12px;color:var(--muted);margin-top:4px">Ellenőrzés...</div>
      </div>
      <button class="btn btn-accent" id="polar-btn" onclick="location.href='/api/auth'">Csatlakozás</button>
    </div>

    <!-- Dátumválasztó (ha csatlakoztatva) -->
    <div id="fetch-section" class="hidden" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
      <div class="row">
        <div><label style="font-size:11px;color:var(--muted)">Kezdet</label><br>
          <input type="date" id="from" style="font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text)"></div>
        <div><label style="font-size:11px;color:var(--muted)">Vég</label><br>
          <input type="date" id="to" style="font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text)"></div>
        <button class="btn btn-green" id="fetch-btn" onclick="fetchFromPolar()">Letöltés</button>
      </div>
      <div class="quick-btns">
        <button class="btn" onclick="setRange(30)">30 nap</button>
        <button class="btn" onclick="setRange(90)">90 nap</button>
        <button class="btn" onclick="setRange(180)">fél év</button>
        <button class="btn" onclick="setRange(365)">1 év</button>
      </div>
      <div id="progress" class="hidden">
        <div class="progress-bar"><div class="progress-fill" id="pbar" style="width:0%"></div></div>
        <div class="progress-text" id="ptxt"></div>
      </div>
    </div>
  </div>

  <!-- Vagy fájl betöltés -->
  <div class="card" id="upload-card">
    <div class="upload-zone" onclick="document.getElementById('file').click()">
      📂 JSON / CSV fájl betöltése
      <input type="file" id="file" accept=".json,.csv" onchange="loadFile(event)">
    </div>
    <div style="text-align:center;margin-top:8px">
      <button class="btn" onclick="loadDemo()">Demó adatok</button>
    </div>
  </div>

  <!-- Eredmények -->
  <div id="results" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <span style="font-size:14px;font-weight:500" id="title"></span>
        <div class="row">
          <button class="btn" onclick="exportCSV()">CSV</button>
          <button class="btn" onclick="exportJSON()">JSON</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <div class="tabs" id="tabs"></div>
      <div class="chart-box"><canvas id="ch0"></canvas></div>
      <div class="chart-box hidden"><canvas id="ch1"></canvas></div>
      <div class="chart-box hidden"><canvas id="ch2"></canvas></div>
      <div class="chart-box hidden"><canvas id="ch3"></canvas></div>
      <div class="chart-box hidden"><canvas id="ch4"></canvas></div>
      <div id="legend" class="legend"></div>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:500;margin-bottom:8px">Utolsó 30 éjszaka</div>
      <div class="scroll-x" style="max-height:300px;overflow-y:auto">
        <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let D=[],CHS=[];
const TABS=['Pontszám','Fázisok','Időzítés','HRV + pulzus','Havi'];
const LEGS=[
  [{c:'var(--accent)',l:'Alváspontszám'}],
  [{c:'var(--deep)',l:'Mély'},{c:'var(--rem)',l:'REM'},{c:'var(--light)',l:'Könnyű'}],
  [{c:'var(--accent2)',l:'Lefekvés'},{c:'var(--warn)',l:'Ébredés'}],
  [{c:'var(--good)',l:'HRV'},{c:'var(--danger)',l:'Ny. pulzus'}],
  [{c:'var(--accent)',l:'Pontszám'},{c:'var(--deep)',l:'Mély'},{c:'var(--rem)',l:'REM'}],
];
function avg(a){const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length*10)/10:null}
function fH(h){if(h==null||isNaN(h))return'–';const hh=h>=24?h-24:h;return Math.floor(hh)+':'+(Math.round((hh%1)*60)+'').padStart(2,'0')}
function fmt(d){return d.toISOString().slice(0,10)}

// ── Init: állapot ellenőrzés ──
async function init(){
  try{
    const r=await fetch('/api/status').then(r=>r.json());
    const el=document.getElementById('polar-status');
    const btn=document.getElementById('polar-btn');
    if(r.connected){
      el.innerHTML='<span class="dot" style="background:var(--good)"></span> Csatlakoztatva';
      btn.textContent='Újrakapcsolás';btn.className='btn';
      document.getElementById('fetch-section').classList.remove('hidden');
      setRange(365);
    }else{
      el.innerHTML='<span class="dot" style="background:var(--danger)"></span> Nincs csatlakoztatva';
    }
  }catch{
    document.getElementById('polar-card').innerHTML='<div style="font-size:13px;color:var(--muted)">Polar csatlakozás nem elérhető (helyi fájl mód).</div>';
  }
}

function setRange(days){
  const to=new Date(),from=new Date();from.setDate(to.getDate()-days);
  document.getElementById('from').value=fmt(from);
  document.getElementById('to').value=fmt(to);
}

// ── Polar-ból letöltés (28 napos batchek) ──
async function fetchFromPolar(){
  const from=document.getElementById('from').value;
  const to=document.getElementById('to').value;
  if(!from||!to)return;

  document.getElementById('fetch-btn').disabled=true;
  document.getElementById('progress').classList.remove('hidden');
  D=[];

  const start=new Date(from),end=new Date(to);
  const totalDays=Math.round((end-start)/86400000);
  const BATCH=28;
  let cursor=new Date(from),fetched=0;

  while(cursor<end){
    const bEnd=new Date(cursor);bEnd.setDate(bEnd.getDate()+BATCH);
    if(bEnd>end)bEnd.setTime(end.getTime());
    const pct=Math.round(fetched/totalDays*100);
    document.getElementById('pbar').style.width=pct+'%';
    document.getElementById('ptxt').textContent=pct+'% — '+fmt(cursor)+' → '+fmt(bEnd);

    try{
      const r=await fetch(`/api/sleep?from=${fmt(cursor)}&to=${fmt(bEnd)}`).then(r=>r.json());
      if(r.nights)D.push(...r.nights);
    }catch(e){console.error(e)}

    fetched+=BATCH;
    cursor=new Date(bEnd);cursor.setDate(cursor.getDate()+1);
    await new Promise(r=>setTimeout(r,500));
  }

  document.getElementById('pbar').style.width='100%';
  document.getElementById('ptxt').textContent='✓ '+D.length+' éjszaka letöltve';
  document.getElementById('fetch-btn').disabled=false;

  // Deduplikáció
  const map=new Map();
  D.forEach(n=>{const e=map.get(n.date);map.set(n.date,{...(e||{}),...n})});
  D=[...map.values()].sort((a,b)=>a.date.localeCompare(b.date));

  if(D.length)render();
}

// ── Fájl betöltés (fallback) ──
function loadFile(e){
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const txt=ev.target.result;
      D=f.name.endsWith('.json')?JSON.parse(txt):parseCSV(txt);
      render();
    }catch(err){alert('Hiba: '+err.message)}
  };reader.readAsText(f);
}
function parseCSV(txt){
  const lines=txt.trim().split('\n');
  const hdr=lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
  return lines.slice(1).map(line=>{
    const vals=line.split(',');const row={};
    hdr.forEach((h,i)=>{const v=(vals[i]||'').trim().replace(/"/g,'');row[h]=v===''?null:isNaN(v)?v:+v});
    return row;
  }).filter(r=>r.date);
}

// ── Demó ──
function loadDemo(){
  D=[];let bh=40,s=2026;
  function R(){s=(s*16807)%2147483647;return(s-1)/2147483646}
  function rg(m,sd){return m+sd*(Math.sqrt(-2*Math.log(R()))*Math.cos(2*Math.PI*R()))}
  for(let i=364;i>=0;i--){
    const dt=new Date();dt.setDate(dt.getDate()-i);const d=dt.toISOString().slice(0,10);const wd=dt.getDay();
    bh=Math.max(28,Math.min(60,bh+rg(.05,1.5)));
    D.push({date:d,sleep_score:Math.round(Math.max(35,Math.min(98,65+rg(0,10)+(wd===0||wd===6?3:-1)))),
      total_sleep_min:Math.round(Math.max(300,Math.min(540,420+rg(0,40)))),
      deep_sleep_min:Math.round(Math.max(30,Math.min(120,70+rg(0,15)))),
      rem_sleep_min:Math.round(Math.max(40,Math.min(130,90+rg(0,18)))),
      light_sleep_min:Math.round(Math.max(100,Math.min(250,200+rg(0,30)))),
      bedtime_hour:Math.round((22.5+rg(0,.6))*100)/100,
      wake_hour:Math.round((6.8+rg(0,.5))*100)/100,
      sleep_efficiency:Math.round(Math.max(70,Math.min(98,88+rg(0,4)))),
      interruptions:Math.round(Math.max(0,rg(2,1.5))),
      ans_charge:Math.round(rg(2,5)*10)/10,
      hrv_avg:Math.round(Math.max(15,bh+rg(0,4))),
      resting_hr:Math.round(Math.max(40,55-bh*.15+rg(0,2))),
      breathing_rate:Math.round((14+rg(0,1))*10)/10});
  }
  render();
}

// ── Megjelenítés ──
function render(){
  if(!D.length)return;
  D.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  document.getElementById('results').classList.remove('hidden');
  document.getElementById('title').textContent=D.length+' éjszaka — '+D[0].date+' → '+D[D.length-1].date;
  const m=[['Pontszám',avg(D.map(r=>r.sleep_score)),'/ 100'],['Alvásidő',avg(D.map(r=>r.total_sleep_min)),'perc'],
    ['Mély',avg(D.map(r=>r.deep_sleep_min)),'perc'],['REM',avg(D.map(r=>r.rem_sleep_min)),'perc'],
    ['HRV',avg(D.map(r=>r.hrv_avg)),'ms'],['ANS',avg(D.map(r=>r.ans_charge)),''],
    ['Lefekvés',fH(avg(D.map(r=>r.bedtime_hour))),''],['Kelés',fH(avg(D.map(r=>r.wake_hour))),'']];
  document.getElementById('stats').innerHTML=m.map(([l,v,u])=>
    '<div class="stat"><div class="stat-l">'+l+'</div><div class="stat-v">'+(v??'–')+'</div><div class="stat-u">'+u+'</div></div>').join('');
  document.getElementById('tabs').innerHTML=TABS.map((n,i)=>'<button class="tab'+(i===0?' on':'')+'" onclick="showTab('+i+',this)">'+n+'</button>').join('');
  drawCharts();drawTable();showLeg(0);
}
function showTab(i,b){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));b.classList.add('on');
  document.querySelectorAll('.chart-box').forEach((c,j)=>c.classList.toggle('hidden',j!==i));showLeg(i)}
function showLeg(i){document.getElementById('legend').innerHTML=LEGS[i].map(({c,l})=>'<span><i style="background:'+c+'"></i>'+l+'</span>').join('')}

function getCS(){const s=getComputedStyle(document.documentElement);const g=n=>s.getPropertyValue(n).trim();
  return{accent:g('--accent'),accent2:g('--accent2'),deep:g('--deep'),rem:g('--rem'),light:g('--light'),
    warn:g('--warn'),good:g('--good'),danger:g('--danger'),muted:g('--muted')}}

function drawCharts(){
  CHS.forEach(c=>c.destroy());CHS=[];const cs=getCS();
  const labels=D.map(r=>(r.date||'').slice(5));
  const o={responsive:true,maintainAspectRatio:false,animation:false,
    plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},
    scales:{x:{ticks:{color:cs.muted,autoSkip:true,maxTicksLimit:12,maxRotation:45,font:{size:10}},grid:{display:false}},
      y:{ticks:{color:cs.muted,font:{size:10}},grid:{color:cs.muted+'22'},beginAtZero:false}}};
  CHS.push(new Chart(document.getElementById('ch0'),{type:'line',data:{labels,datasets:[
    {data:D.map(r=>r.sleep_score),borderColor:cs.accent,tension:.3,pointRadius:0,borderWidth:1.5,spanGaps:true,fill:{target:'origin',above:cs.accent+'15'}}
  ]},options:o}));
  CHS.push(new Chart(document.getElementById('ch1'),{type:'bar',data:{labels,datasets:[
    {data:D.map(r=>r.deep_sleep_min),backgroundColor:cs.deep,borderRadius:1},
    {data:D.map(r=>r.rem_sleep_min),backgroundColor:cs.rem,borderRadius:1},
    {data:D.map(r=>r.light_sleep_min),backgroundColor:cs.light,borderRadius:1}
  ]},options:{...o,scales:{...o.scales,x:{...o.scales.x,stacked:true},y:{...o.scales.y,stacked:true,beginAtZero:true}}}}));
  CHS.push(new Chart(document.getElementById('ch2'),{type:'line',data:{labels,datasets:[
    {data:D.map(r=>r.bedtime_hour),borderColor:cs.accent2,tension:.3,pointRadius:0,borderWidth:1.5,spanGaps:true},
    {data:D.map(r=>r.wake_hour),borderColor:cs.warn,tension:.3,pointRadius:0,borderWidth:1.5,spanGaps:true}
  ]},options:{...o,scales:{...o.scales,y:{...o.scales.y,ticks:{...o.scales.y.ticks,callback:v=>fH(v)}}}}}));
  CHS.push(new Chart(document.getElementById('ch3'),{type:'line',data:{labels,datasets:[
    {data:D.map(r=>r.hrv_avg),borderColor:cs.good,tension:.3,pointRadius:0,borderWidth:1.5,spanGaps:true},
    {data:D.map(r=>r.resting_hr),borderColor:cs.danger,tension:.3,pointRadius:0,borderWidth:1.5,spanGaps:true,borderDash:[4,3]}
  ]},options:o}));
  const weeks=new Map();D.forEach(r=>{const w=r.date.slice(0,7);if(!weeks.has(w))weeks.set(w,[]);weeks.get(w).push(r)});
  const wl=[...weeks.keys()];
  CHS.push(new Chart(document.getElementById('ch4'),{type:'bar',data:{labels:wl.map(w=>w.slice(2)),datasets:[
    {data:wl.map(w=>avg(weeks.get(w).map(r=>r.sleep_score))),backgroundColor:cs.accent,borderRadius:2,barPercentage:.4},
    {data:wl.map(w=>avg(weeks.get(w).map(r=>r.deep_sleep_min))),backgroundColor:cs.deep+'88',borderRadius:2,barPercentage:.4},
    {data:wl.map(w=>avg(weeks.get(w).map(r=>r.rem_sleep_min))),backgroundColor:cs.rem+'88',borderRadius:2,barPercentage:.4}
  ]},options:{...o,scales:{...o.scales,x:{...o.scales.x,stacked:false},y:{...o.scales.y,beginAtZero:true}}}}));
}

function drawTable(){
  const cols=[['Dátum','date'],['Pont','sleep_score'],['Alvás','total_sleep_min'],['Mély','deep_sleep_min'],['REM','rem_sleep_min'],['HRV','hrv_avg'],['ANS','ans_charge'],['Pulzus','resting_hr']];
  document.getElementById('thead').innerHTML='<tr>'+cols.map(([n])=>'<th>'+n+'</th>').join('')+'</tr>';
  document.getElementById('tbody').innerHTML=D.slice().reverse().slice(0,30).map(r=>
    '<tr>'+cols.map(([,k])=>'<td>'+(r[k]??'–')+'</td>').join('')+'</tr>').join('');
}

function exportCSV(){if(!D.length)return;const c=Object.keys(D[0]);
  dl([c.join(','),...D.map(r=>c.map(k=>{const v=String(r[k]??'');return v.includes(',')?'"'+v+'"':v}).join(','))].join('\n'),'polar_sleep.csv','text/csv')}
function exportJSON(){if(D.length)dl(JSON.stringify(D,null,2),'polar_sleep.json','application/json')}
function dl(c,n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}

init();
</script>
</body></html>
